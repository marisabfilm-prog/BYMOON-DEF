<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Perfil | BYMOON</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="../../../css/utility-clases_variables.css" />
    <link rel="stylesheet" href="../../../css/estrellas.css" />
    <link rel="stylesheet" href="../../../css/botones.css" />
    <link rel="stylesheet" href="../../../css/footer-nav.css" />
    <link rel="stylesheet" href="../../../css/perfil.css" />
    <link rel="stylesheet" href="../../../css/editar-perfil.css" />
</head>

<body>
   

    <header class="flex flex-space-between flex-align-items-c">
        <a href="../../../index.html" class="logo-nav">
            <img class="logo" src="../../../svg/logo.svg" alt="bymoon." />
        </a>
        <nav class="flex flex-align-items-c flex-wrap">
            <a href="../ayuda-nocturna/">Ayuda nocturna</a>
            <a href="../../../index.html">Entrega lunar</a>
            <a href="../desvelados/index.html">Desvelados</a>
            <a href="#">Suscripción</a>
            <a href="index.html">
                <img class="icono-perfil" src="../../../svg/perfil.svg" alt="perfil" />
            </a>
        </nav>
    </header>

    <main class="main-editar-perfil">

        <div class="estrellas-1"></div>
        <div class="estrellas-2"></div>
        <div class="estrellas-3"></div>
        <a href="index.html" class="btn-volver">← Volver al perfil</a>

        <section class="perfil-header-edit">
            <div class="perfil-avatar-wrap">
                <img src="../../../jpg/categoria-4.jpg" alt="Tu foto de perfil" class="avatar-img" />
                <div class="icon-edit-overlay" title="Cambiar foto de perfil">📷</div>
            </div>

            <div class="nombre-edit-wrap">
                <h1 class="perfil-nombre">@tunombre</h1>
                <span class="icon-edit-inline" title="Editar nombre de usuario">✏️</span>
            </div>

            <div class="bio-edit-wrap">
                <p class="perfil-bio">Donde el ruido del mundo se apaga...</p>
                <span class="icon-edit-inline" title="Editar biografía">✏️</span>
            </div>
        </section>

        <form class="form-editar-perfil" action="#" method="POST" onsubmit="return false;">
            <div class="input-group">
                <input type="email" id="edit-email" name="email" placeholder="Cambiar correo electrónico" class="input-edit"
                    autocomplete="email">
            </div>
        
            <div class="input-group">
                <input type="password" id="edit-password" name="password" placeholder="Nueva contraseña" class="input-edit"
                    autocomplete="new-password">
            </div>
        
            <button type="submit" class="btn-guardar-cambios">Guardar cambios</button>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-card">
            <div class="footer-mission-social">
                <p class="footer-mision">Transformar el desvelo<br>en un espacio de calma</p>
                <img class="icono-social" src="../../../svg/tiktok.svg" alt="tiktok" width="40px" />
                <img class="icono-social" src="../../../svg/instagram.svg" alt="instagram" width="40px" />
            </div>
            <div class="footer-col">
                <p class="footer-col-titulo">MARCA + LEGAL</p>
                <a href="#" class="footer-link footer-link-rosa">Nuestra historia</a>
                <a href="#" class="footer-link">Tu seguridad y privacidad</a>
            </div>
            <div class="footer-col">
                <p class="footer-col-titulo">SOPORTE</p>
                <a href="#" class="footer-link">Contáctanos</a>
                <a href="#" class="footer-link">Centro de ayuda</a>
                <p class="footer-copy">©2026. BYMOON.</p>
            </div>
        </div>
        <img class="bymoon-footer" src="../../../svg/bymoon-footer.svg" alt="bymoon-footer" />
    </footer>
</body>

</html>
